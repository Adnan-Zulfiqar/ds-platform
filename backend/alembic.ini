; Alembic configuration.
;
; The database URL is deliberately absent from this file. It is injected at
; runtime by alembic/env.py from application settings, so that credentials live
; only in the environment and never in a file that could be committed.

[alembic]
script_location = alembic
prepend_sys_path = .

; Timestamped, slugged revision filenames. The default (bare revision hash)
; makes a directory of migrations impossible to scan by eye.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = UTC

; Fail rather than silently truncate an over-long slug.
truncate_slug_length = 60

version_path_separator = os
recursive_version_locations = false
sqlalchemy.url =

[post_write_hooks]
hooks = ruff_format,ruff_fix
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_fix.type = console_scripts
ruff_fix.entrypoint = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
