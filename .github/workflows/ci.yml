name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel superseded runs on the same ref. Without this, pushing three commits in
# quick succession runs three full pipelines and only the last matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"

jobs:
  # -------------------------------------------------------------------------
  # Secrets and deployment defaults (M18)
  #
  # First job on purpose, and it needs nothing: a committed secret should fail
  # the run in under a minute rather than after a full test suite. It is also
  # the only check here that catches a mistake the application cannot — Compose
  # substituting a published password produces a working DSN, so nothing
  # downstream can tell it happened.
  # -------------------------------------------------------------------------
  secrets:
    name: Security — committed secrets & deployment defaults
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check for committed secrets and insecure defaults
        run: python scripts/check_secrets.py

      # Proves the guard added in M18 actually refuses, rather than trusting
      # that the `:?` syntax was written correctly. A guard nobody exercises is
      # a guard that quietly stops working.
      - name: Compose must refuse to start without a database password
        run: |
          set +e
          output=$(env -u POSTGRES_PASSWORD -u RABBITMQ_PASSWORD \
            docker compose config 2>&1)
          status=$?
          set -e

          if [ $status -eq 0 ]; then
            echo "::error::docker compose accepted an unset POSTGRES_PASSWORD."
            echo "A deployment would silently use a password published in this repository."
            exit 1
          fi

          echo "$output" | grep -q "POSTGRES_PASSWORD" || {
            echo "::error::Compose failed, but not with the expected message."
            echo "$output"
            exit 1
          }
          echo "Compose correctly refused: the password guard works."

  # -------------------------------------------------------------------------
  # Backend
  # -------------------------------------------------------------------------
  backend:
    name: Backend — lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Real Postgres and Redis rather than mocks. Integration tests that run
    # against a fake prove only that the fake behaves as expected.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: droppilot
          POSTGRES_PASSWORD: droppilot
          POSTGRES_DB: droppilot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      ENVIRONMENT: test
      POSTGRES_HOST: localhost
      POSTGRES_USER: droppilot
      POSTGRES_PASSWORD: droppilot
      POSTGRES_DB: droppilot_test
      REDIS_HOST: localhost
      SECURITY_SECRET_KEY: ci-only-secret-not-used-anywhere-else
      LOG_JSON_OUTPUT: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Lint and type-check run before tests: they fail in seconds, whereas the
      # suite takes minutes, so a formatting mistake is reported quickly.
      - name: Lint (ruff)
        run: ruff check --output-format=github .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy app

      - name: Run migrations
        run: alembic upgrade head

      - name: Tests (pytest)
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 7

  # -------------------------------------------------------------------------
  # Frontend
  # -------------------------------------------------------------------------
  frontend:
    name: Frontend — lint, types, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` not `npm install`: installs exactly the lockfile, so CI cannot
      # silently test a different dependency tree than a developer has locally.
      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_ENVIRONMENT: test

  # -------------------------------------------------------------------------
  # Container images + Compose config (C1)
  # -------------------------------------------------------------------------
  docker:
    name: Docker — build images & compose config
    runs-on: ubuntu-latest
    # Only after the code is known good. Building three images for a branch
    # that fails linting wastes several minutes per run.
    needs: [backend, frontend]

    strategy:
      # Report every broken Dockerfile in one run rather than stopping at the
      # first.
      fail-fast: false
      matrix:
        image: [backend, worker, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          # Build only — publishing belongs to a deploy workflow with registry
          # credentials, which this repository does not yet have.
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  compose-config:
    name: Docker — compose config validation
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: |
          # Minimal .env so variable substitution succeeds without secrets.
          cat > .env <<'EOF'
          POSTGRES_USER=droppilot
          POSTGRES_PASSWORD=droppilot
          POSTGRES_DB=droppilot
          RABBITMQ_USER=droppilot
          RABBITMQ_PASSWORD=droppilot
          SECURITY_SECRET_KEY=ci-only-secret-not-used-anywhere-else
          NEXT_PUBLIC_API_URL=http://localhost:8000
          EOF
          docker compose config --quiet
          docker compose config --services | grep -E '^(postgres|redis|rabbitmq|backend|worker|beat|frontend|nginx)$'

  # -------------------------------------------------------------------------
  # Celery against a real RabbitMQ broker (M15)
  # -------------------------------------------------------------------------
  celery-broker:
    name: Celery — broker verification
    runs-on: ubuntu-latest
    needs: [backend]
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: droppilot
          POSTGRES_PASSWORD: droppilot
          POSTGRES_DB: droppilot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      rabbitmq:
        image: rabbitmq:4-alpine
        env:
          RABBITMQ_DEFAULT_USER: droppilot
          RABBITMQ_DEFAULT_PASS: droppilot
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10

    env:
      ENVIRONMENT: test
      POSTGRES_HOST: localhost
      POSTGRES_USER: droppilot
      POSTGRES_PASSWORD: droppilot
      POSTGRES_DB: droppilot_test
      REDIS_HOST: localhost
      SECURITY_SECRET_KEY: ci-only-secret-not-used-anywhere-else
      CELERY_BROKER_URL: amqp://droppilot:droppilot@localhost:5672//
      CELERY_RESULT_BACKEND: redis://localhost:6379/3
      LOG_JSON_OUTPUT: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run migrations
        run: alembic upgrade head

      - name: Start Celery worker
        run: |
          celery -A app.workers.celery_app.celery_app worker \
            --loglevel=info \
            --concurrency=1 \
            --queues=celery,integrations \
            > /tmp/celery-worker.log 2>&1 &
          echo $! > /tmp/celery-worker.pid
          # Wait until the worker answers inspect ping.
          for i in $(seq 1 30); do
            if celery -A app.workers.celery_app.celery_app inspect ping --timeout 2 2>/dev/null | grep -q OK; then
              echo "worker ready"
              exit 0
            fi
            sleep 2
          done
          echo "worker failed to become ready" >&2
          cat /tmp/celery-worker.log >&2
          exit 1

      - name: Verify broker, registration, and task execution
        run: python scripts/verify_celery_broker.py

      - name: Stop worker
        if: always()
        run: |
          if [ -f /tmp/celery-worker.pid ]; then
            kill "$(cat /tmp/celery-worker.pid)" || true
          fi
          tail -n 80 /tmp/celery-worker.log || true

  # -------------------------------------------------------------------------
  # Optional Compose smoke (full stack). Continues on failure so C1 partial
  # credit is still visible; the job result is reported honestly.
  # -------------------------------------------------------------------------
  compose-smoke:
    name: Docker — compose smoke (best effort)
    runs-on: ubuntu-latest
    needs: [docker, compose-config]
    # Do not block the whole workflow on smoke flakiness — still run it.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Prepare env
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=droppilot
          POSTGRES_PASSWORD=droppilot
          POSTGRES_DB=droppilot
          RABBITMQ_USER=droppilot
          RABBITMQ_PASSWORD=droppilot
          SECURITY_SECRET_KEY=ci-only-secret-not-used-anywhere-else
          NEXT_PUBLIC_API_URL=http://localhost:8000
          ENVIRONMENT=local
          EOF

      - name: Build and start stack
        run: docker compose up -d --build

      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health/live >/dev/null 2>&1; then
              echo "backend live"
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --tail=100
          exit 1

      - name: Tear down
        if: always()
        run: docker compose down -v
