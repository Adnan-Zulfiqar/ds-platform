name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel superseded runs on the same ref. Without this, pushing three commits in
# quick succession runs three full pipelines and only the last matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"

jobs:
  # -------------------------------------------------------------------------
  # Secrets and deployment defaults (M18)
  #
  # First job on purpose, and it needs nothing: a committed secret should fail
  # the run in under a minute rather than after a full test suite. It is also
  # the only check here that catches a mistake the application cannot — Compose
  # substituting a published password produces a working DSN, so nothing
  # downstream can tell it happened.
  # -------------------------------------------------------------------------
  secrets:
    name: Security — committed secrets & deployment defaults
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check for committed secrets and insecure defaults
        run: python scripts/check_secrets.py

      # Proves the guard added in M18 actually refuses, rather than trusting
      # that the `:?` syntax was written correctly. A guard nobody exercises is
      # a guard that quietly stops working.
      - name: Compose must refuse to start without a database password
        run: |
          set +e
          output=$(env -u POSTGRES_PASSWORD \
            RABBITMQ_PASSWORD=ci-only-guard-placeholder \
            docker compose config 2>&1)
          status=$?
          set -e

          if [ $status -eq 0 ]; then
            echo "::error::docker compose accepted an unset POSTGRES_PASSWORD."
            echo "A deployment would silently use a password published in this repository."
            exit 1
          fi

          echo "$output" | grep -q "POSTGRES_PASSWORD" || {
            echo "::error::Compose failed, but not with the expected message."
            echo "$output"
            exit 1
          }
          echo "Compose correctly refused: the password guard works."

  # -------------------------------------------------------------------------
  # Backend
  # -------------------------------------------------------------------------
  backend:
    name: Backend — lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Real Postgres and Redis rather than mocks. Integration tests that run
    # against a fake prove only that the fake behaves as expected.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: droppilot
          POSTGRES_PASSWORD: droppilot
          POSTGRES_DB: droppilot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      ENVIRONMENT: test
      POSTGRES_HOST: localhost
      POSTGRES_USER: droppilot
      POSTGRES_PASSWORD: droppilot
      POSTGRES_DB: droppilot_test
      REDIS_HOST: localhost
      SECURITY_SECRET_KEY: ci-only-secret-not-used-anywhere-else
      LOG_JSON_OUTPUT: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements/dev.txt

      - name: Use PostgreSQL 17 client tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ca-certificates curl
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          printf '%s\n' \
            'Types: deb' \
            'URIs: https://apt.postgresql.org/pub/repos/apt' \
            "Suites: ${VERSION_CODENAME}-pgdg" \
            "Architectures: $(dpkg --print-architecture)" \
            'Components: main' \
            'Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc' \
            | sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Verify PostgreSQL client major version
        run: |
          test "$(pg_dump --version | awk '{print $3}' | cut -d. -f1)" = "17"
          test "$(pg_restore --version | awk '{print $3}' | cut -d. -f1)" = "17"
          pg_dump --version
          pg_restore --version

      # From the hash lock, exactly as the Docker images install. Resolving the
      # open ranges in pyproject.toml let CI drift ahead of what is shipped:
      # on 2026-10-01 it picked up SQLAlchemy 2.1.1 (lock: 2.0.52) and mypy
      # failed 70 times on code nobody had changed.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python scripts/check_dependency_lock.py --only dev
          pip install --require-hashes --no-deps -r requirements/dev.txt
          pip install --no-deps -e .

      # Lint and type-check run before tests: they fail in seconds, whereas the
      # suite takes minutes, so a formatting mistake is reported quickly.
      - name: Lint (ruff)
        run: ruff check --output-format=github .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy app

      - name: Run migrations
        run: alembic upgrade head

      - name: Tests (pytest)
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 7

  # -------------------------------------------------------------------------
  # Frontend
  # -------------------------------------------------------------------------
  frontend:
    name: Frontend — lint, types, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` not `npm install`: installs exactly the lockfile, so CI cannot
      # silently test a different dependency tree than a developer has locally.
      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_ENVIRONMENT: test

  # -------------------------------------------------------------------------
  # Container images + Compose config (C1)
  # -------------------------------------------------------------------------
  docker:
    name: Docker — build images & compose config
    runs-on: ubuntu-latest
    # Only after the code is known good. Building three images for a branch
    # that fails linting wastes several minutes per run.
    needs: [backend, frontend]

    strategy:
      # Report every broken Dockerfile in one run rather than stopping at the
      # first.
      fail-fast: false
      matrix:
        image: [backend, worker, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          # Build only — publishing belongs to a deploy workflow with registry
          # credentials, which this repository does not yet have.
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  compose-config:
    name: Docker — compose config validation
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: |
          # Minimal .env so variable substitution succeeds without secrets.
          cat > .env <<'EOF'
          POSTGRES_USER=droppilot
          POSTGRES_PASSWORD=droppilot
          POSTGRES_DB=droppilot
          RABBITMQ_USER=droppilot
          RABBITMQ_PASSWORD=droppilot
          SECURITY_SECRET_KEY=ci-only-secret-not-used-anywhere-else
          NEXT_PUBLIC_API_URL=http://localhost
          EOF
          docker compose config --quiet
          docker compose config --services | grep -E '^(postgres|redis|rabbitmq|backend|worker|beat|frontend|nginx)$'

  # -------------------------------------------------------------------------
  # Celery against a real RabbitMQ broker (M15)
  # -------------------------------------------------------------------------
  celery-broker:
    name: Celery — broker verification
    runs-on: ubuntu-latest
    needs: [backend]
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: droppilot
          POSTGRES_PASSWORD: droppilot
          POSTGRES_DB: droppilot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      rabbitmq:
        image: rabbitmq:4-alpine
        env:
          RABBITMQ_DEFAULT_USER: droppilot
          RABBITMQ_DEFAULT_PASS: droppilot
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10

    env:
      ENVIRONMENT: test
      POSTGRES_HOST: localhost
      POSTGRES_USER: droppilot
      POSTGRES_PASSWORD: droppilot
      POSTGRES_DB: droppilot_test
      REDIS_HOST: localhost
      SECURITY_SECRET_KEY: ci-only-secret-not-used-anywhere-else
      CELERY_BROKER_URL: amqp://droppilot:droppilot@localhost:5672//
      CELERY_RESULT_BACKEND: redis://localhost:6379/3
      LOG_JSON_OUTPUT: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements/dev.txt

      # From the hash lock, exactly as the Docker images install. Resolving the
      # open ranges in pyproject.toml let CI drift ahead of what is shipped:
      # on 2026-10-01 it picked up SQLAlchemy 2.1.1 (lock: 2.0.52) and mypy
      # failed 70 times on code nobody had changed.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python scripts/check_dependency_lock.py --only dev
          pip install --require-hashes --no-deps -r requirements/dev.txt
          pip install --no-deps -e .

      - name: Run migrations
        run: alembic upgrade head

      - name: Start Celery worker
        run: |
          celery -A app.workers.celery_app.celery_app worker \
            --loglevel=info \
            --concurrency=1 \
            --queues=default,integrations \
            > /tmp/celery-worker.log 2>&1 &
          echo $! > /tmp/celery-worker.pid
          # Wait until the worker answers inspect ping.
          for i in $(seq 1 30); do
            if celery -A app.workers.celery_app.celery_app inspect ping --timeout 2 2>/dev/null | grep -q OK; then
              echo "worker ready"
              exit 0
            fi
            sleep 2
          done
          echo "worker failed to become ready" >&2
          cat /tmp/celery-worker.log >&2
          exit 1

      - name: Verify broker, registration, and task execution
        run: python scripts/verify_celery_broker.py

      - name: Verify durable pipeline bulk worker
        run: python scripts/verify_pipeline_bulk_broker.py

      - name: Stop worker
        if: always()
        run: |
          if [ -f /tmp/celery-worker.pid ]; then
            kill "$(cat /tmp/celery-worker.pid)" || true
          fi
          tail -n 80 /tmp/celery-worker.log || true

  # -------------------------------------------------------------------------
  # Compose smoke — the deployment path (C1)
  #
  # **Blocking.** It was `continue-on-error: true`, which meant a green run
  # proved nothing about whether the stack comes up: the one job that exercises
  # the deployment path was the one job allowed to fail silently. C1 cannot be
  # closed by a check nobody has to pass.
  #
  # Docker cannot run on the development machine (no WSL2), so this job is the
  # only place the deployment path is ever executed. It therefore checks that
  # services genuinely reach each other rather than merely that processes
  # started — `/health/ready` is the important one, because it fails unless the
  # backend can talk to Postgres *and* Redis by service name across the Compose
  # network.
  # -------------------------------------------------------------------------
  compose-smoke:
    name: Docker — compose smoke (full stack)
    runs-on: ubuntu-latest
    needs: [docker, compose-config]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Prepare env
        run: |
          # Values exist only for this run. POSTGRES_PASSWORD and
          # RABBITMQ_PASSWORD are mandatory since M18 — Compose refuses to start
          # without them, which is the behaviour the `secrets` job asserts.
          cat > .env <<'EOF'
          POSTGRES_USER=droppilot
          POSTGRES_PASSWORD=ci-only-postgres-password
          POSTGRES_DB=droppilot
          RABBITMQ_USER=droppilot
          RABBITMQ_PASSWORD=ci-only-rabbitmq-password
          SECURITY_SECRET_KEY=ci-only-secret-not-used-anywhere-else-32chars
          NEXT_PUBLIC_API_URL=http://localhost
          CORS_ORIGINS=http://localhost:3000,http://localhost
          ENVIRONMENT=local
          EOF

      - name: Build and start stack
        run: docker compose up -d --build

      - name: Every container reached a running state
        run: |
          sleep 20
          docker compose ps
          # A container that exited is a failure even if others are healthy —
          # `up -d` returns success as long as it managed to *start* them.
          if docker compose ps --status exited --quiet | grep -q .; then
            echo "::error::One or more containers exited."
            docker compose ps
            docker compose logs --tail=200
            exit 1
          fi

      - name: Backend is live
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8000/health/live >/dev/null 2>&1 && {
              echo "backend live"; exit 0; }
            sleep 5
          done
          echo "::error::Backend never became live."
          docker compose logs --tail=200 backend
          exit 1

      - name: Backend reaches Postgres and Redis (cross-container networking)
        run: |
          # The real integration check. /health/ready reports each dependency
          # separately, so a failure names which link is broken rather than
          # saying "not ready".
          for i in $(seq 1 60); do
            body=$(curl -fsS http://localhost:8000/health/ready 2>/dev/null || true)
            if echo "$body" | grep -q '"ready":true'; then
              echo "ready: $body"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Backend never reached its dependencies. Last: ${body:-<none>}"
          docker compose logs --tail=200 backend postgres redis
          exit 1

      - name: Celery worker registered with the broker
        run: |
          # Proves worker -> RabbitMQ. `inspect ping` round-trips through the
          # broker, so it fails if the worker started but cannot reach it.
          for i in $(seq 1 30); do
            if docker compose exec -T worker \
              celery -A app.workers.celery_app.celery_app inspect ping 2>/dev/null \
              | grep -q pong; then
              echo "worker responded via the broker"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Celery worker never answered through the broker."
          docker compose logs --tail=200 worker rabbitmq
          exit 1

      - name: Celery beat is scheduling
        run: |
          docker compose logs beat | grep -qiE "beat: Starting|Scheduler:" || {
            echo "::error::Celery beat did not start its scheduler."
            docker compose logs --tail=200 beat
            exit 1
          }
          echo "beat scheduler started"

      - name: Frontend serves
        run: |
          for i in $(seq 1 40); do
            curl -fsS http://localhost:3000 >/dev/null 2>&1 && {
              echo "frontend serving"; exit 0; }
            sleep 5
          done
          echo "::error::Frontend never served."
          docker compose logs --tail=200 frontend
          exit 1

      - name: Nginx routes to both upstreams
        run: |
          # Proves nginx -> backend and nginx -> frontend by service name.
          # Checked through port 80, not the published app ports, so a
          # misconfigured proxy cannot pass by accident.
          curl -fsS http://localhost/nginx-health >/dev/null || {
            echo "::error::nginx is not answering."; docker compose logs --tail=100 nginx; exit 1; }

          curl -fsS http://localhost/api/v1/../health/live >/dev/null 2>&1 \
            || curl -fsS http://localhost/health/live >/dev/null || {
            echo "::error::nginx does not route to the backend."
            docker compose logs --tail=100 nginx; exit 1; }

          curl -fsS http://localhost/ >/dev/null || {
            echo "::error::nginx does not route to the frontend."
            docker compose logs --tail=100 nginx; exit 1; }
          echo "nginx routes to backend and frontend"

      - name: Frontend bundle uses nginx origin (A-05)
        run: |
          # NEXT_PUBLIC_API_URL is inlined at build time. If it still points at
          # :8000, browsers via :80 bypass nginx /api and hit CORS/cookie bugs.
          hits=$(docker compose exec -T frontend sh -c \
            "grep -R --include='*.js' -F 'localhost:8000' /app 2>/dev/null | head -5" || true)
          if [ -n "$hits" ]; then
            echo "::error::Frontend image embeds localhost:8000 — bake http://localhost for compose."
            echo "$hits"
            exit 1
          fi
          echo "frontend bundle does not embed localhost:8000"

      - name: Diagnostics on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=300

      - name: Tear down
        if: always()
        run: docker compose down -v

  # -------------------------------------------------------------------------
  # Playwright e2e (audit A-06 / M13)
  #
  # Gates UI + auth wiring on push. Rate limit is elevated only in this job —
  # production / .env.example defaults stay at 100.
  # -------------------------------------------------------------------------
  frontend-e2e:
    name: Frontend — Playwright e2e
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: droppilot
          POSTGRES_PASSWORD: droppilot
          POSTGRES_DB: droppilot_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      ENVIRONMENT: local
      POSTGRES_HOST: localhost
      POSTGRES_USER: droppilot
      POSTGRES_PASSWORD: droppilot
      POSTGRES_DB: droppilot_e2e
      REDIS_HOST: localhost
      SECURITY_SECRET_KEY: ci-only-secret-not-used-anywhere-else-32chars
      SECURITY_COOKIE_SECURE: "false"
      SECURITY_RATE_LIMIT_ENABLED: "true"
      SECURITY_RATE_LIMIT_REQUESTS: "1000"
      SECURITY_ENCRYPTION_KEYS: "dGVzdC1rZXktMS1ORVZFUi1VU0UtSU4tUFJPRC0hISE=,dGVzdC1rZXktMi1ORVZFUi1VU0UtSU4tUFJPRC0hISE="
      # Synthetic eBay application identifiers, so the eBay integration card is
      # *configured* here and its Playwright coverage actually runs instead of
      # skipping. Nothing in these tests contacts eBay: `connect` only builds a
      # consent URL, and the redirect to eBay is aborted by the test. These are
      # not credentials for any real eBay application and grant nothing.
      EBAY_CLIENT_ID: DropPilo-CiOnlyNo-PRD-000000000-00000000
      EBAY_CLIENT_SECRET: PRD-ci-only-not-a-real-ebay-certificate-id
      EBAY_REDIRECT_URI_NAME: DropPilot-CiOnly-RuName
      # Synthetic Shopify Partner app identifiers so the Connect Shopify button
      # is *configured* and OAuth callback HMAC classification can run. Nothing
      # here contacts Shopify: authorize URLs are stubbed/aborted by the tests.
      # Not credentials for any real Shopify application and grant nothing.
      SHOPIFY_API_KEY: ci-only-not-a-real-shopify-api-key
      SHOPIFY_API_SECRET: ci-only-not-a-real-shopify-api-secret
      SHOPIFY_CALLBACK_URL: http://127.0.0.1:8000/api/v1/integrations/shopify/callback
      SHOPIFY_FRONTEND_RETURN_URL: http://127.0.0.1:3000/settings/integrations
      # Synthetic Google OAuth web client id (same value on backend + frontend).
      # AUTH-G1 Playwright stubs `accounts.google.com/gsi/client` and never
      # contacts Google; without a client id the button renders nothing and the
      # suite fails on `getByTestId('google-sign-in')`. Not a real Cloud client.
      GOOGLE_OAUTH_CLIENT_ID: 1000000000000-ci-playwright.apps.googleusercontent.com
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: 1000000000000-ci-playwright.apps.googleusercontent.com
      # Frontend and API must share the 127.0.0.1 host. Playwright's default
      # http://localhost:3000 → http://127.0.0.1:8000 is cross-site, so the
      # SameSite=Lax refresh cookie is not sent on credentialed fetches and
      # every hard navigation looks logged-out (Account menu never appears).
      E2E_BASE_URL: http://127.0.0.1:3000
      CORS_ORIGINS: http://127.0.0.1:3000
      LOG_JSON_OUTPUT: "false"
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_ENVIRONMENT: local
      E2E_DATABASE_URL: postgresql+psycopg://droppilot:droppilot@127.0.0.1:5432/droppilot_e2e
      E2E_PYTHON: python
      # Ephemeral CI Postgres/Redis + this job's own backend on :8000 — not
      # production. Requires CI + platform GITHUB_ACTIONS + this flag;
      # see resolveE2eApiUrl. Local runs must use 127.0.0.1:8100–8199.
      E2E_ALLOW_LOCAL_8000: "1"
      CI: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements/runtime.txt

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python scripts/check_dependency_lock.py --only runtime
          pip install --require-hashes --no-deps -r requirements/runtime.txt
          pip install --no-deps -e .

      - name: Migrate database
        working-directory: backend
        run: alembic upgrade head

      - name: Verify e2e database identity and Alembic head
        working-directory: backend
        run: |
          set -euo pipefail
          current="$(alembic current 2>/dev/null | awk '{print $1}')"
          if [ "$current" != "0039" ]; then
            echo "::error::Expected Alembic head 0039, got ${current:-<none>}"
            exit 1
          fi
          python - <<'PY'
          import os
          import sqlalchemy as sa

          db = os.environ["POSTGRES_DB"]
          url = (
              f"postgresql+psycopg://{os.environ['POSTGRES_USER']}:"
              f"{os.environ['POSTGRES_PASSWORD']}@{os.environ['POSTGRES_HOST']}:5432/{db}"
          )
          with sa.create_engine(url).connect() as conn:
              name = conn.execute(sa.text("select current_database()")).scalar()
          if name != "droppilot_e2e":
              raise SystemExit(f"expected droppilot_e2e, connected to {name!r}")
          print(f"verified database {name} at Alembic {os.popen('alembic current').read().strip()}")
          PY

      - name: Start API
        working-directory: backend
        run: |
          uvicorn app.main:app --no-proxy-headers --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/health/live >/dev/null && exit 0
            sleep 2
          done
          echo "::error::API never became live"
          exit 1

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Verify seed harness CI contract
        working-directory: frontend
        run: npx playwright test tests/e2e/seed-harness.spec.ts --project=chromium

      - name: Run Playwright (chromium)
        working-directory: frontend
        run: npx playwright test --project=chromium

      # Published on success too (DP-P00-02 F-2): the `github` reporter prints
      # totals only, so without the artifact a green run cannot show *which*
      # tests skipped or why. The name carries SHA/run/attempt so evidence is
      # tied to an exact execution and re-runs cannot collide. On an early
      # cancellation no report may exist; that is reported, not treated as a
      # pass — the Playwright step's own exit code is what gates the job.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.sha }}-run${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
          if-no-files-found: warn
