name: Agent bridge - self checks

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/ISSUE_TEMPLATE/agent-task.yml"
      - ".github/PULL_REQUEST_TEMPLATE/agent-managed.md"
      - ".github/workflows/agent-bridge-checks.yml"
      - ".github/workflows/claude-developer.yml"
      - ".github/workflows/cursor-debugger.yml"
      - "scripts/agent_bridge/**"
      - "AGENT_BRIDGE.md"
  push:
    branches: [main]
    paths:
      - ".github/ISSUE_TEMPLATE/agent-task.yml"
      - ".github/PULL_REQUEST_TEMPLATE/agent-managed.md"
      - ".github/workflows/agent-bridge-checks.yml"
      - ".github/workflows/claude-developer.yml"
      - ".github/workflows/cursor-debugger.yml"
      - "scripts/agent_bridge/**"
      - "AGENT_BRIDGE.md"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile bridge scripts
        run: python -m compileall -q scripts/agent_bridge
      - name: Run bridge policy tests
        run: python -m unittest discover -s scripts/agent_bridge/tests -v
