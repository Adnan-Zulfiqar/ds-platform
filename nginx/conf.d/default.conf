# DropPilot AI — reverse proxy.
#
# Single public entry point. The frontend and the API share one origin, which
# means the browser makes same-origin requests: no CORS preflight on every call,
# and authentication cookies work without SameSite=None.
#
# TLS terminates at Cloudflare in front of this. Adding a listen 443 block here
# would be the change if TLS ever terminates at the origin instead.

server {
    listen 80;
    server_name _;

    # Applied to every location. Duplicated from the application layer on
    # purpose — an origin exposed directly, or a misrouted request, still gets
    # them.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    limit_conn conn_limit 20;

    # Nginx's own health, distinct from the application's. Lets a load balancer
    # tell "the proxy is down" from "the API behind it is down".
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ---- API ----
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        # Overwritten, not appended: a client-supplied X-Forwarded-For would
        # otherwise let anyone spoof their source address and defeat both
        # rate limiting and abuse tracking.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # API responses are per-tenant and must never be cached by a shared
        # proxy.
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # Health probes bypass the rate limiter entirely — throttling a probe makes
    # the orchestrator declare a healthy service dead.
    location /health {
        access_log off;
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    # ---- Static assets ----
    #
    # Content-hashed filenames, so a long immutable cache is safe: a changed
    # file gets a new URL rather than a stale cached copy.
    location /_next/static/ {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";

        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ---- Frontend ----
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for the dev server's hot-reload websocket.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
