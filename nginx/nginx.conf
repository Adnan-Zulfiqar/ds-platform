# DropPilot AI — Nginx main configuration.
#
# Server blocks live in conf.d/. This file holds process-level and
# protocol-level settings only.

user nginx;
# One worker per core.
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    # Accept as many connections as possible per wake-up rather than one.
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # JSON access logs, matching the structured logs the application emits so a
    # single aggregator pipeline handles both.
    log_format json_combined escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"request_id":"$http_x_request_id",'
        '"user_agent":"$http_user_agent"'
    '}';

    access_log /var/log/nginx/access.log json_combined;

    # Kernel-space file transfer; avoids copying through user space.
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Do not advertise the Nginx version in responses or error pages.
    server_tokens off;

    # Cap request bodies. The default of 1MB is too small for product image
    # uploads in later phases; anything far above this is an attack rather than
    # a legitimate request.
    client_max_body_size 20m;
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 30s;

    # ---- Compression ----
    gzip on;
    # Compress responses from upstreams too, not just static files.
    gzip_proxied any;
    gzip_comp_level 5;   # beyond ~6 the CPU cost outweighs the byte savings
    gzip_min_length 1024;
    # Tells caches that a compressed and uncompressed response differ.
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # ---- Rate limiting ----
    #
    # A coarse edge limit that complements, rather than replaces, the
    # per-tenant limiter in the application. This one stops a flood before it
    # reaches Python at all.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ---- Upstreams ----
    upstream backend_upstream {
        server backend:8000;
        # Reuse connections to the API instead of a new TCP handshake per
        # request.
        keepalive 32;
    }

    upstream frontend_upstream {
        server frontend:3000;
        keepalive 32;
    }

    include /etc/nginx/conf.d/*.conf;
}
